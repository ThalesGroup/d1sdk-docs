<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Callback</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            font-size: 22px;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            word-break: break-all;
        }
        th {
            background: #f2f2f2;
        }
        th:first-child, td:first-child {
            width: 250px;
            font-weight: bold;
        }
        .empty {
            color: #888;
            font-style: italic;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Test Callback</h1>
<div id="content"></div>

<script>
    // Function to get data from URL hash (fragment)
    function getHashParams() {
        var params = {};
        var hash = window.location.hash.substring(1); // Remove the # character
        if (!hash) return params;
        var pairs = hash.split('&');
        for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split('=');
            var key = decodeURIComponent(pair[0]);
            var value = pair.length > 1 ? decodeURIComponent(pair.slice(1).join('=')) : '';
            params[key] = value;
        }
        return params;
    }

    // Function to get query parameters (fallback for GET requests)
    function getQueryParams() {
        var params = {};
        var queryString = window.location.search.substring(1);
        if (!queryString) return params;
        var pairs = queryString.split('&');
        for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split('=');
            var key = decodeURIComponent(pair[0]);
            var value = pair.length > 1 ? decodeURIComponent(pair.slice(1).join('=')) : '';
            params[key] = value;
        }
        return params;
    }

    // Try to get data from URL hash first (for POST with hash), then fallback to query params
    var params = getHashParams();
    if (Object.keys(params).length === 0) {
        params = getQueryParams();
    }

    var contentDiv = document.getElementById('content');
    var keys = Object.keys(params);

    if (keys.length === 0) {
        contentDiv.innerHTML = '<div class="empty">No parameters were provided. This page expects to receive data via POST request from mock_visa.html.</div>';
    } else {
        var html = '<table><thead><tr><th>Parameter</th><th>Value</th></tr></thead><tbody>';
        keys.forEach(function (key) {
            html += '<tr><td>' + key + '</td><td>' + params[key] + '</td></tr>';
        });
        html += '</tbody></table>';
        contentDiv.innerHTML = html;
    }
</script>

</body>
</html>
